<!--CSS-->
<style id="s-ext-css">
/* ===== #exterior — „Ocolește capsula.”: carusel 3D pe derulare nativă + harta de sus cu conul camerei ===== */
#exterior{padding:clamp(70px,8vw,110px) 0;position:relative}
.s-ext-head{align-items:flex-end;flex-wrap:nowrap;gap:24px 40px}
.s-ext-hl{flex:1 1 0;min-width:0}
.s-ext-note{font-size:15px;line-height:1.5;color:var(--mute);max-width:46ch;margin-top:14px}
.s-ext-note .s{display:none}
/* harta + săgeți: pe calculator săgețile stau în stânga hărții, aliniate jos (antet de 200px) */
.s-ext-nav{flex:none;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:18px}
.s-ext-map{width:200px;height:200px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.s-ext-map svg{display:block;width:100%;height:100%;overflow:visible}
.s-ext-ctl{display:flex;align-items:center;gap:10px}
.s-ext-ctl .caps-round{padding:0 0 2px}
#extCount{min-width:3.4em;text-align:center;font:600 14px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--ink)}
.s-ext-dot{cursor:pointer;outline:none}
.s-ext-dot .k{fill:#9aa1ad;transition:fill .3s}
.s-ext-dot.on .k{fill:#d4a24c}
.s-ext-dot .r{fill:transparent;stroke:none}
.s-ext-dot:focus-visible .r{stroke:var(--accent-ink);stroke-width:1.5px;vector-effect:non-scaling-stroke}
@media (hover:hover) and (pointer:fine){.s-ext-dot:hover .k{fill:var(--accent-ink)}.s-ext-dot.on:hover .k{fill:#d4a24c}}
.s-ext-cam{transform-box:view-box;transform-origin:0 0;transition:transform .6s var(--ease);pointer-events:none}
/* pista: scroller orizontal propriu, cu perspectivă */
.s-ext-track{--fh:min(60svh,100svh - 360px,580px);--lw:min(calc(var(--fh)*1.6),84vw);--H:calc(var(--lw)/1.6);position:relative;margin-top:16px;display:flex;align-items:center;gap:28px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;perspective:1500px;padding:48px calc(50% - var(--lw)/2) 56px;outline:none;-webkit-tap-highlight-color:transparent}
.s-ext-track::-webkit-scrollbar{display:none}
.s-ext-f{flex:none;margin:0;position:relative;height:var(--H);scroll-snap-align:center;transform-style:preserve-3d;cursor:pointer;-webkit-user-select:none;user-select:none}
/* cardul din cadru primește transformarea 3D (nu cadrul: zonele de snap rămân netransformate și stabile) */
.s-ext-c{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:#e9ebef;box-shadow:0 30px 60px -30px rgba(15,20,30,.35);will-change:transform,opacity}
.s-ext-f.L{width:calc(var(--H)*1.6)}
.s-ext-f.P{width:calc(var(--H)*.8)}
.s-ext-f.on{cursor:zoom-in}
.s-ext-f picture{display:block;width:100%;height:100%}
.s-ext-f img{width:100%;height:100%;max-width:none;object-fit:cover;object-position:var(--op,50% 50%);opacity:0;transition:opacity .6s var(--ease);pointer-events:none;-webkit-user-drag:none}
.s-ext-f img.ld{opacity:1}
.s-ext-f .caps-label{opacity:0;transform:translateY(8px);transition:opacity .3s var(--ease),transform .3s var(--ease);pointer-events:none}
.s-ext-f.on .caps-label{opacity:1;transform:none}
.s-ext-track:focus-visible .s-ext-f.on .s-ext-c{outline:3px solid var(--accent);outline-offset:4px}
@media (hover:hover) and (pointer:fine){.s-ext-track{cursor:grab}.s-ext-track.drag,.s-ext-track.drag .s-ext-f{cursor:grabbing}}
.s-ext-track{transition:opacity .22s var(--ease)}
.s-ext-track.s-ext-cut{opacity:0}
.s-ext-below:empty{display:none}
.s-ext-fine{margin-top:0}
@media (min-width:1101px){.s-ext-track{--fh:min(54svh,100svh - 360px,520px)}}
@media (min-width:1101px){.s-ext-track{-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}}
/* tabletă */
@media (min-width:801px) and (max-width:1100px){
 .s-ext-track{--fh:min(46svh,100svh - 360px,520px)}
 .s-ext-nav{flex-direction:column;align-items:center;gap:12px}
 .s-ext-map{width:150px;height:150px;padding:6px;border-radius:16px}
}
/* telefon înalt: cadre 4:5, harta mică și săgețile sub pistă */
@media (max-width:800px) and (min-height:621px){
 .s-ext-note{font-size:14px}
 .s-ext-note .l{display:none}.s-ext-note .s{display:inline}
 .s-ext-track{margin-top:6px;gap:14px;perspective:1000px;padding:20px calc(50% - min(39vw,190px)) 34px}
 .s-ext-f,.s-ext-f.L,.s-ext-f.P{width:min(78vw,380px);height:auto;aspect-ratio:4/5}
 .s-ext-c{box-shadow:0 18px 32px -18px rgba(15,20,30,.38)}
 .s-ext-fine{padding-right:72px}
 .s-ext-f img{object-position:var(--opp,50% 50%)}
 .s-ext-below{display:flex;align-items:center}
 .s-ext-below .s-ext-nav{flex-direction:row;align-items:center;gap:16px}
 .s-ext-map{width:112px;height:112px;padding:4px;border-radius:14px}
 .s-ext-map .s-ext-in{display:none}
}
/* ecran scurt (≤620px înălțime: panoul 506×506, telefon culcat) */
@media (max-height:620px){
 .s-ext-note{font-size:14px;max-width:none}
 .s-ext-note .l,.s-ext-note .d{display:none}.s-ext-note .s{display:inline}
 .s-ext-track{--H:min(56svh,calc(84vw / 1.6),300px);--lw:calc(var(--H)*1.6);margin-top:4px;gap:20px;padding:16px calc(50% - var(--lw)/2) 28px}
 .s-ext-c{box-shadow:0 16px 28px -16px rgba(15,20,30,.38)}
 .s-ext-map{display:none}
 .s-ext-below{display:flex;justify-content:center;margin-bottom:8px}
 .s-ext-below .s-ext-nav{flex-direction:row;align-items:center}
}
@media (prefers-reduced-motion:reduce){.s-ext-f img{opacity:1}.s-ext-f .caps-label{transform:none}}
</style>

<!--JS-->
<script>
/* opririle ocolului (ordinea = un ocol complet; harta: ușa sus, livingul la stânga, ca planul din #interior).
   phi = unghiul camerei pe hartă (180 = în fața ușii); x,y = punctul de pe cercul r=46 (x=-46·sin φ, y=46·cos φ). */
window.EXT=[
 {f:'img/ext/ext_04a.webp',kind:'L',phi:180,x:0,y:-46,op:'50% 55%',opp:'50% 60%',t:'Latura cu intrarea și scărița'},
 {f:'img/ext/ext_07a.webp',fp:'img/ext/ext_07p.webp',kind:'L',phi:140,x:-29.57,y:-35.24,op:'55% 55%',opp:'50% 55%',t:'Colțul vitrat de lângă intrare'},
 {f:'img/ext/ext_05p.webp',kind:'P',phi:110,x:-43.23,y:-15.73,op:'50% 55%',opp:'50% 55%',t:'Capătul vitrat, cu ușa de sticlă'},
 {f:'img/ext/ext_06a.webp',kind:'L',phi:75,x:-44.43,y:11.91,op:'45% 50%',opp:'42% 50%',t:'Acoperișul rotunjit și sticla curbată'},
 {f:'img/ext/ext_08a.webp',fp:'img/ext/ext_08p.webp',kind:'L',phi:45,x:-32.53,y:32.53,op:'40% 50%',opp:'50% 55%',t:'Colțul spre latura din spate, cu grila de ventilație'},
 {f:'img/ext/real_v5.webp',kind:'L',phi:-40,x:29.57,y:35.24,op:'62% 55%',opp:'28% 55%',t:'Latura din spate: fereastra panoramică și ventilația'},
 {f:'img/ext/ext_03p.webp',kind:'P',phi:-62,x:40.62,y:21.6,op:'50% 50%',opp:'50% 50%',t:'Fereastra panoramică, de aproape'},
 {f:'img/ext/real_v1.webp',kind:'L',phi:-130,x:35.24,y:-29.57,op:'45% 55%',opp:'28% 55%',t:'Colțul vitrat de la celălalt capăt'}];
(function(){'use strict';
const S=document.getElementById('exterior'),C=window.CAPS;if(!S||!C||!window.EXT)return;
const T=document.getElementById('extTrack'),head=S.querySelector('.s-ext-head'),below=S.querySelector('.s-ext-below'),nav=S.querySelector('.s-ext-nav'),
 cnt=document.getElementById('extCount'),live=document.getElementById('extLive'),dotsG=document.getElementById('extDots'),cam=document.getElementById('extCam'),
 bPrev=document.getElementById('extPrev'),bNext=document.getElementById('extNext');
const NS='http://www.w3.org/2000/svg';
const SIZE={L:[1600,1000],P:[1000,1250]};

/* ---------- construcție: un cadru + un punct pe hartă pentru fiecare oprire ---------- */
let items=window.EXT.map(e=>{
 const fig=document.createElement('figure');fig.className='s-ext-f '+e.kind;
 fig.style.setProperty('--op',e.op);fig.style.setProperty('--opp',e.opp||e.op);
 const pic=document.createElement('picture');let src=null;
 if(e.fp){src=document.createElement('source');src.media='(max-width:800px) and (min-height:621px)';src.dataset.srcset=e.fp;pic.appendChild(src)}
 const img=document.createElement('img');const wh=/real_v/.test(e.f)?[1600,900]:SIZE[e.kind];
 img.width=wh[0];img.height=wh[1];img.alt=e.t;img.decoding='async';img.draggable=false;img.dataset.src=e.f;pic.appendChild(img);
 const cap=document.createElement('span');cap.className='caps-label';cap.setAttribute('aria-hidden','true');cap.textContent=e.t;
 const card=document.createElement('div');card.className='s-ext-c';card.append(pic,cap);fig.appendChild(card);T.appendChild(fig);
 const dot=document.createElementNS(NS,'g');dot.setAttribute('class','s-ext-dot');dot.setAttribute('role','button');dot.setAttribute('tabindex','0');
 dot.setAttribute('aria-label','Privește din: '+e.t);dot.setAttribute('transform',`translate(${e.x} ${e.y})`);
 dot.innerHTML='<circle class="r" r="7"/><circle class="k" r="3"/>';dotsG.appendChild(dot);
 return {e,fig,card,img,src,dot};
});
const idx=el=>items.findIndex(o=>o.fig===el||o.dot===el);

/* ---------- încărcare: nimic la prima afișare; sursele vin după load, la un ecran distanță ---------- */
let loaded=false;
function eager(i){if(!loaded)return;for(let k=i-2;k<=i+2;k++){const o=items[(k+items.length)%items.length];if(o&&o.img.loading!=='eager')o.img.loading='eager'}}
function loadAll(){if(loaded)return;loaded=true;
 items.forEach((o,i)=>{o.img.loading=(i<3||i===items.length-1)?'eager':'lazy';
  o.img.addEventListener('load',()=>o.img.classList.add('ld'),{once:true});
  o.img.addEventListener('error',()=>drop(o),{once:true});
  if(o.src)o.src.srcset=o.src.dataset.srcset;o.img.src=o.img.dataset.src});
 eager(act<0?0:act)}
function drop(o){const i=items.indexOf(o);if(i<0)return;o.fig.remove();o.dot.remove();items.splice(i,1);act=-1;measure();schedule()}
C.afterLoad(()=>C.near(S,'100% 0px',loadAll));

/* ---------- coverflow pe derularea pistei ---------- */
let M=[],act=-1,phi=null,raf=0,pending=null,pendT=0,pendL=0;
// când cadrul ocupă peste 70% din lățime (telefon, tabletă, panoul îngust), rotirea completă ar împinge vecinii
// complet în afara ecranului: acolo 3D-ul e mai blând, ca vecinii să se vadă pe margini
let G={r:24,z:90,s:.06};
function measure(){M=items.map(o=>({c:o.fig.offsetLeft+o.fig.offsetWidth/2,w:o.fig.offsetWidth||1}));
 const big=Math.max(1,...M.map(m=>m.w))/(T.clientWidth||1)>.7;G=big?{r:10,z:40,s:.05}:{r:24,z:90,s:.06}}
function schedule(){if(!raf)raf=requestAnimationFrame(update)}
function update(){raf=0;if(!items.length)return;
 const mid=T.scrollLeft+T.clientWidth/2,rm=C.rm.matches;let best=0,bd=Infinity;
 const ds=items.map((o,i)=>{const d=(M[i].c-mid)/M[i].w;if(Math.abs(d)<bd){bd=Math.abs(d);best=i}return d});
 items.forEach((o,i)=>{const s=o.card.style;
  if(rm){s.transform='none';s.opacity=i===best?'1':'.6';return}
  const d=Math.max(-2,Math.min(2,ds[i])),a=Math.abs(d);
  s.transform=`rotateY(${(d*-G.r).toFixed(2)}deg) translateZ(${(-a*G.z).toFixed(1)}px) scale(${(1-a*G.s).toFixed(4)})`;
  s.opacity=(1-a*.25).toFixed(3)});
 setActive(best)}
function rotateCam(t){if(phi===null)phi=t;else phi+=(((t-phi)%360)+540)%360-180;cam.style.transform=`rotate(${phi}deg)`}
function setActive(i){if(i===act)return;act=i;
 items.forEach((o,k)=>{o.fig.classList.toggle('on',k===i);o.dot.classList.toggle('on',k===i)});
 cnt.textContent=(i+1)+' / '+items.length;rotateCam(items[i].e.phi);eager(i);
 if(AP.state==='done'&&AP.user)live.textContent=(i+1)+' / '+items.length+': '+items[i].e.t}
function hold(i,left){pending=i;pendL=left;clearTimeout(pendT);pendT=setTimeout(()=>{pending=null},2000)}
function go(i,beh){if(!items.length)return;i=((i%items.length)+items.length)%items.length;loadAll();
 const f=items[i].fig,left=f.offsetLeft+f.offsetWidth/2-T.clientWidth/2;hold(i,left);
 T.scrollTo({left,behavior:beh||(C.rm.matches?'auto':'smooth')})}
const base=()=>pending!==null?pending:Math.max(0,act);
/* pas ±1 (săgeți, taste, turul automat); de la 8 la 1 (și invers) ocolul se închide printr-o tăietură scurtă,
   ca harta să meargă înainte pe cerc în loc să deruleze înapoi prin toate unghiurile */
let cutT=0;
function cut(i){hold(i,-1);
 if(C.rm.matches){go(i,'auto');return}
 T.classList.add('s-ext-cut');clearTimeout(cutT);
 cutT=setTimeout(()=>{go(i,'auto');requestAnimationFrame(()=>T.classList.remove('s-ext-cut'))},220)}
function step(k){const n=items.length,to=base()+k;if(to<0||to>=n)cut(((to%n)+n)%n);else go(to)}
T.addEventListener('scroll',schedule,{passive:true});
// ținta în curs se uită doar când pista chiar a ajuns la ea (un scrollend al unei derulări întrerupte nu contează)
if('onscrollend' in T)T.addEventListener('scrollend',()=>{if(Math.abs(T.scrollLeft-pendL)<3||T.scrollLeft<=0||T.scrollLeft>=T.scrollWidth-T.clientWidth-1)pending=null});

/* ---------- comenzi: săgeți, taste, puncte de pe hartă, click pe cadru ---------- */
function user(){AP.user=true;stopAuto()}
bPrev.addEventListener('click',()=>{user();step(-1)});
bNext.addEventListener('click',()=>{user();step(1)});
T.addEventListener('keydown',e=>{const lb=document.getElementById('lb');if(lb&&lb.classList.contains('on'))return;
 const k={ArrowLeft:-1,ArrowRight:1}[e.key];
 if(k){e.preventDefault();user();step(k)}
 else if(e.key==='Home'||e.key==='End'){e.preventDefault();user();go(e.key==='Home'?0:items.length-1)}
 else if(e.key==='Enter'&&act>=0){user();C.lb(items.map(o=>[o.e.f,o.e.t]),act)}});
dotsG.addEventListener('click',e=>{const g=e.target.closest('.s-ext-dot');if(!g)return;user();go(idx(g))});
dotsG.addEventListener('keydown',e=>{const g=e.target.closest('.s-ext-dot');if(!g||(e.key!=='Enter'&&e.key!==' '))return;e.preventDefault();user();go(idx(g))});
let moved=false;
T.addEventListener('click',e=>{if(moved){moved=false;e.preventDefault();e.stopPropagation();return}
 const f=e.target.closest('.s-ext-f');if(!f)return;const i=idx(f);if(i<0)return;user();
 if(i===act)C.lb(items.map(o=>[o.e.f,o.e.t]),i);else go(i)},true);

/* ---------- tragere cu mouse-ul (doar pointer fin); pe touch rămâne derularea nativă ---------- */
let drag=null,snapT=0;
function snapBack(){clearTimeout(snapT);const done=()=>{clearTimeout(snapT);T.removeEventListener('scrollend',done);if(!drag)T.style.scrollSnapType=''};
 if('onscrollend' in T)T.addEventListener('scrollend',done);snapT=setTimeout(done,800)}
T.addEventListener('pointerdown',e=>{user();moved=false;if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('button'))return;
 drag={id:e.pointerId,x:e.clientX,sl:T.scrollLeft,lx:e.clientX,lt:performance.now(),v:0,on:false}});
T.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x;
 if(!drag.on){if(Math.abs(dx)<=6)return;drag.on=true;moved=true;try{T.setPointerCapture(e.pointerId)}catch(_){}
  clearTimeout(snapT);T.style.scrollSnapType='none';T.classList.add('drag')}
 T.scrollLeft=drag.sl-dx;const now=performance.now(),dt=now-drag.lt;
 if(dt>0){drag.v=.75*((e.clientX-drag.lx)/dt)+.25*drag.v;drag.lx=e.clientX;drag.lt=now}});
function endDrag(e){if(!drag||(e&&e.pointerId!==drag.id))return;const d=drag;drag=null;if(!d.on)return;
 T.classList.remove('drag');try{T.releasePointerCapture(d.id)}catch(_){}
 measure();const mid=T.scrollLeft+T.clientWidth/2;let i=0,bd=Infinity;M.forEach((m,k)=>{const a=Math.abs(m.c-mid);if(a<bd){bd=a;i=k}});
 const v=performance.now()-d.lt>120?0:d.v;
 if(v<-.3&&M[i].c<=mid+4)i=Math.min(items.length-1,i+1);else if(v>.3&&M[i].c>=mid-4)i=Math.max(0,i-1);
 go(i);snapBack()}
T.addEventListener('pointerup',endDrag);T.addEventListener('pointercancel',endDrag);T.addEventListener('lostpointercapture',endDrag);

/* ---------- turul automat: o singură tură, o singură dată ---------- */
const AP={state:'idle',step:0,timer:0,user:false,hover:false,focus:false,view:false,hx:null,hy:null};
const paused=()=>AP.hover||AP.focus||document.hidden||!AP.view;
function tick(){AP.timer=0;if(AP.state!=='run'||paused())return;AP.step++;
 if(AP.step>=items.length){AP.state='done';cut(0);return}go(AP.step);arm(4000)}
function arm(ms){clearTimeout(AP.timer);AP.timer=0;if(AP.state==='run'&&!paused())AP.timer=setTimeout(tick,ms)}
function stopAuto(){AP.state='done';clearTimeout(AP.timer);AP.timer=0}
function wake(){if(AP.state==='run'&&!AP.timer&&!paused())arm(AP.step?4000:2400)}
function sleep(){if(AP.timer){clearTimeout(AP.timer);AP.timer=0}}
new IntersectionObserver(es=>{const en=es[es.length-1];AP.view=en.intersectionRatio>=.5;
 if(AP.view&&AP.state==='idle'&&!C.rm.matches&&items.length>1){AP.state='run';loadAll()}
 AP.view?wake():sleep()},{threshold:[0,.5,1]}).observe(T);
// pauză la hover doar dacă mouse-ul chiar se mișcă peste pistă (nu când pagina derulează pe sub un cursor nemișcat)
T.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;if(AP.hx!==null&&(Math.abs(e.clientX-AP.hx)>2||Math.abs(e.clientY-AP.hy)>2)){AP.hover=true;sleep()}AP.hx=e.clientX;AP.hy=e.clientY});
T.addEventListener('pointerleave',()=>{AP.hover=false;AP.hx=AP.hy=null;wake()});
S.addEventListener('focusin',()=>{AP.focus=true;sleep()});
S.addEventListener('focusout',e=>{if(!S.contains(e.relatedTarget)){AP.focus=false;wake()}});
document.addEventListener('visibilitychange',()=>document.hidden?sleep():wake());
T.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY))user()},{passive:true});
T.addEventListener('touchstart',user,{passive:true});
nav.addEventListener('pointerdown',user);

/* ---------- mod: harta și săgețile sub pistă pe telefon și pe ecran scurt ---------- */
function place(){const t=(C.phone.matches||C.short.matches)?below:head;if(nav.parentNode!==t)t.appendChild(nav)}
function relayout(){if(C.rm.matches)stopAuto();place();measure();if(act>=0&&!drag&&pending===null){const f=items[act].fig;T.scrollLeft=f.offsetLeft+f.offsetWidth/2-T.clientWidth/2}schedule()}
[C.phone,C.short,C.rm].forEach(q=>q.addEventListener('change',relayout));
let rzT=0;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(relayout,120)},{passive:true});
if(window.ResizeObserver)new ResizeObserver(()=>{measure();schedule()}).observe(T);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measure();schedule()});
place();measure();update();
})();
</script>
