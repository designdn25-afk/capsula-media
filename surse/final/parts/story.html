<!--CSS--><style id="s-st-css">
/* ===================== #top — deschiderea: filmul care rulează singur (26 nov 2026) =====================
   Clientul a trimis un site de referință (un film în care casa „se formează”, cu titlul peste el) și a cerut: „vreau să-mi faci și
   mie așa… cum se formează casa capsulă X7, să pară real, să nu mai fie cu scroll cum am băgat noi”. Filmul (img/st/formare-*.mp4)
   e făcut din cadrele filmării reale de la deschiderea veche: capsula apare ca schiță, se „umple” în casă reală, acoperișul coboară
   pe ea, camera se rotește în jurul ei dimineața, apoi vine seara. Cum se reface: surse/film-deschidere/. Varianta dinainte (povestea
   legată de derulare): surse/final/parts/story-derulare.html + versiuni/inainte-film-automat/. */
:root{--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif}
#top.st{position:relative;padding:0;background:#0b1730;--st-ink:#fff;--st-mute:rgba(255,255,255,.82);--st-gold:#e3b866}
.hf-pin{position:relative;height:100vh;height:100svh;min-height:540px;max-height:1200px;overflow:hidden;isolation:isolate;background:#0b2545 center/cover no-repeat}
.hf-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%;display:block;transform:translateZ(0);will-change:transform}
.hf-veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(6,10,22,.78) 0%,rgba(6,10,22,.52) 32%,rgba(6,10,22,0) 62%),linear-gradient(180deg,rgba(6,10,22,.5) 0,rgba(6,10,22,0) 150px),linear-gradient(0deg,rgba(6,10,22,.55),rgba(6,10,22,0) 26%)}
.st-ai{position:absolute;z-index:3;right:max(16px,calc((100% - 1240px)/2));bottom:22px;margin:0;color:#fff;font:500 10px/1 var(--body);letter-spacing:.02em;white-space:nowrap;pointer-events:none;opacity:.72;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.st-copy{position:absolute;top:0;bottom:0;left:50%;width:min(1240px,100% - 32px);transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.hf-txt{width:min(600px,48vw);color:var(--st-ink);pointer-events:auto;padding-top:40px}
.st-k{display:flex;align-items:center;gap:14px;font:600 12px/1 var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--st-gold)}
.st-k::before{content:"";width:34px;height:1px;background:currentColor}
.st-h{font-family:var(--serif);font-weight:500;font-size:clamp(44px,5.7vw,94px);line-height:.96;letter-spacing:-.015em;margin-top:20px;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.st-h em{font-style:italic;font-weight:400;color:var(--st-gold)}
.st-p{margin-top:22px;max-width:42ch;font-size:clamp(15px,1.15vw,17.5px);line-height:1.6;color:var(--st-mute);text-shadow:0 1px 10px rgba(0,0,0,.45)}
.st-p b{color:#fff;font-weight:700}
.hf-txt .hero-ctas{margin-top:28px}
.btn-dark{background:var(--ink);color:#fff}
#top .btn-dark{background:#fff;color:#0e1116}
#top .btn-ghost{border-color:rgba(255,255,255,.5);color:#fff}
#top .btn-ghost:hover{background:rgba(255,255,255,.12)}
/* rândul care se schimbă odată cu filmul (ce se vede acum) */
.hf-cap{margin-top:26px;min-height:44px;display:flex;align-items:center;gap:12px;font-size:14.5px;line-height:1.35;color:#fff}
.hf-cap i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--st-gold);box-shadow:0 0 0 5px rgba(227,184,102,.22)}
.hf-cap span{transition:opacity .45s ease;max-width:44ch;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.hf-cap span.out{opacity:0}
.hf-cap b{font-weight:700}
/* oprește / pornește filmul */
.hf-pp{position:absolute;z-index:4;right:max(16px,calc((100% - 1240px)/2));bottom:44px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(8,12,24,.5);color:#fff;display:grid;place-items:center;cursor:pointer}
.hf-pp:hover{background:rgba(8,12,24,.6)}
.hf-pp svg{width:16px;height:16px;fill:currentColor}
.hf-pp .pl{display:none}.hf-pp.oprit .pl{display:block}.hf-pp.oprit .pa{display:none}
.hf-bar{position:absolute;z-index:4;left:0;bottom:0;height:3px;width:100%;background:rgba(255,255,255,.14)}
.hf-bar u{display:block;height:100%;width:0;background:var(--st-gold)}
@media (max-width:800px){
  /* ecran îngust: filmul e o bandă sus (se vede aproape întreg), textul stă dedesubt, pe fundal închis */
  .hf-pin{min-height:600px;background-image:none!important;background:#0a1428}
  .hf-v{inset:0 0 auto 0;height:50svh;min-height:280px;object-position:58% 50%;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent);mask-image:linear-gradient(to bottom,#000 72%,transparent)}
  .hf-veil{background:linear-gradient(180deg,rgba(6,10,22,.6) 0,rgba(6,10,22,0) 110px)}
  .st-copy{justify-content:flex-end;padding-bottom:clamp(40px,6svh,64px)}
  .hf-txt{width:auto;padding-top:0}
  .st-h{font-size:clamp(36px,10vw,56px);margin-top:12px}
  .st-p{margin-top:10px;font-size:15px;line-height:1.5}
  .hf-txt .hero-ctas{margin-top:14px;gap:8px}
  .hf-txt .hero-ctas .btn{padding:12px 16px;font-size:13.5px}
  .hf-cap{margin-top:12px;font-size:13.5px;min-height:38px}
  .st-ai{right:auto;left:16px;bottom:12px}
  .hf-pp{bottom:auto;top:76px;right:14px;width:40px;height:40px}
}
@media (max-width:800px) and (max-height:640px){.hf-pin{min-height:500px}.hf-v{height:42svh;min-height:200px}.st-h{font-size:clamp(30px,7.4vw,40px)}.st-p{display:none}.st-copy{padding-bottom:34px}}
@media (max-height:620px) and (min-width:801px){.st-h{font-size:clamp(38px,4.6vw,64px)}.st-p{margin-top:14px}.hf-txt .hero-ctas{margin-top:18px}.hf-cap{margin-top:14px}}
@media (prefers-reduced-motion:reduce){.hf-cap span{transition:none}}
</style><!--/CSS-->

<!--HTML--><!-- DESCHIDEREA: filmul care rulează singur (capsula X7 „se formează”: schiță → casă reală → seara) -->
<section class="st st--dark" id="top" aria-label="Capsula X7: din plan, în casă adevărată">
 <div class="hf-pin" style="background-image:url(img/st/formare-poster.jpg)">
  <video class="hf-v" id="hfV" muted loop playsinline preload="metadata" poster="img/st/formare-poster.jpg" aria-hidden="true" tabindex="-1" disablepictureinpicture></video>
  <div class="hf-veil" aria-hidden="true"></div>
  <p class="st-ai" aria-hidden="true">Imagine realizată cu AI · orientativă</p>
  <div class="st-copy">
   <div class="hf-txt">
    <p class="st-k">Capsula X7 · Ciorogârla</p>
    <h1 class="st-h">Case Capsula<br>și Case <em>Modulare</em></h1>
    <p class="st-p">Un alt fel de acasă. Pentru tine. Pentru vacanțe. Pentru un nou început.</p>
    <div class="hero-ctas"><a href="#interior" class="btn btn-dark">Intră în capsulă ↓</a><a href="#gradina" class="btn btn-accent">Plimbă-te printre case</a><a href="#model" class="btn btn-ghost">Preț și opțiuni</a></div>
    <p class="hf-cap" aria-live="off"><i aria-hidden="true"></i><span id="hfCap"><b>Capsula X7</b> · 36,5 m² utili · <b>39.500 €</b> cu TVA · rate prin TBI Bank</span></p>
   </div>
  </div>
  <button class="hf-pp" id="hfPP" type="button" aria-label="Oprește filmul" aria-pressed="false"><svg class="pa" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3.4v12H3zM9.6 2H13v12H9.6z"/></svg><svg class="pl" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z"/></svg></button>
  <div class="hf-bar" aria-hidden="true"><u id="hfBar"></u></div>
 </div>
</section><!--/HTML-->

<!--JS--><script>/* deschiderea: filmul pornește singur (fără sunet), se oprește când nu se vede și are buton de oprire */
(function(){const v=document.getElementById('hfV'),pp=document.getElementById('hfPP'),cap=document.getElementById('hfCap'),bar=document.getElementById('hfBar');if(!v)return;
window.__skyDark=true;   // bara de sus rămâne cu text deschis peste film
const red=matchMedia('(prefers-reduced-motion:reduce)').matches,con=navigator.connection,save=!!(con&&con.saveData);
const mic=Math.min(innerWidth,innerHeight)<700||innerWidth<900||!!(con&&con.downlink&&con.downlink<8);   // ecran mic sau internet mai încet: filmul mic (pornește mai repede)
/* ce se vede în film, pe secunde (filmul are 30 de cadre pe secundă: surse/film-deschidere/face.py) */
const CAP=[[0,'<b>Din plan, în casă adevărată.</b> Capsula X7 vine gata făcută din fabrică.'],[2.9,'<b>36,5 m² utili.</b> Living, bucătărie, baie completă și dormitor separat.'],[6.2,'<b>Geam triplu LOW-E</b>, din podea până în tavan, cu forme rotunjite.'],[10.2,'<b>Capsula X7</b> · 36,5 m² utili · <b>39.500 €</b> cu TVA · rate prin TBI Bank'],[13.6,'<b>Seara, capsula devine felinar.</b> Lumina se aprinde la un cuvânt.']];
let ci=-1,oprit=false,vazut=true;
const setCap=i=>{if(i===ci)return;ci=i;cap.classList.add('out');setTimeout(()=>{cap.innerHTML=CAP[i][1];cap.classList.remove('out')},red?0:320)};
const tick=()=>{const t=v.currentTime,d=v.duration||18.2;let i=0;for(let k=0;k<CAP.length;k++)if(t>=CAP[k][0])i=k;setCap(i);bar.style.width=(t/d*100).toFixed(2)+'%';if(!v.paused)requestAnimationFrame(tick)};
v.addEventListener('play',()=>requestAnimationFrame(tick));
const arata=()=>{pp.classList.toggle('oprit',v.paused);pp.setAttribute('aria-label',v.paused?'Pornește filmul':'Oprește filmul');pp.setAttribute('aria-pressed',String(v.paused))};
v.addEventListener('pause',arata);v.addEventListener('play',arata);
const porneste=()=>{if(oprit||!vazut)return;const p=v.play();if(p&&p.catch)p.catch(()=>{arata()})};
pp.addEventListener('click',()=>{if(v.paused){oprit=false;if(!v.src){incarca();v.addEventListener('canplaythrough',porneste,{once:true})}else porneste()}else{oprit=true;v.pause()}});
/* filmul se aduce ÎNTREG în memorie înainte să pornească (clientul, 26 nov: „alocă mai multă memorie să meargă mai fluid și să nu se
   blocheze”): așa nu se mai poate opri la mijloc să aștepte după internet. Cât se aduce, se vede imaginea de așteptare și linia de jos. */
let cerut=false;
function incarca(){if(cerut)return;cerut=true;const u=mic?'img/st/formare2-720.mp4':'img/st/formare2-1080.mp4',direct=()=>{v.src=u;v.load()};
 if(!window.fetch||!window.URL||!URL.createObjectURL)return direct();
 fetch(u).then(r=>{if(!r.ok)throw 0;if(!r.body||!r.body.getReader)return r.blob();const n=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let got=0;
   const pump=()=>rd.read().then(x=>{if(x.done)return new Blob(ch,{type:'video/mp4'});ch.push(x.value);got+=x.value.length;if(n)bar.style.width=(got/n*100).toFixed(1)+'%';return pump()});return pump()})
  .then(b=>{bar.style.width='0';v.src=URL.createObjectURL(b);v.load()}).catch(direct)}
if(red||save){oprit=true;arata();cap.innerHTML=CAP[3][1];return}   // mișcare redusă / economie de date: rămâne imaginea, filmul pornește doar la apăsare
incarca();v.addEventListener('canplaythrough',porneste,{once:true});
if('IntersectionObserver' in window)new IntersectionObserver(e=>{vazut=e[0].isIntersecting;if(vazut)porneste();else if(!v.paused)v.pause()},{threshold:.12}).observe(v);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(!v.paused)v.pause()}else porneste()});
})();</script><!--/JS-->
