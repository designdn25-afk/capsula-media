<!doctype html><meta charset="utf-8"><title>captură poveste</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Povestea de la deschidere (js/story.js), filmată în grădina realistă, în jurul capsulei X7 de acolo: sursa pentru filmarea „reală”.
// Scena se construiește o dată; window.__shot(p) desenează cadrul pentru derularea p (0…1), cu aceeași cameră ca povestea pe ecran
// lat 16:9 (cheile L din story.js, copiate mai jos: dacă se schimbă acolo, se schimbă și aici).   ?w=1920
import { THREE } from './js/kit.js';
import { createGScene } from './js/gscene.js';
import { buildGarden } from './js/genv.js';
import { CASE } from './js/gradina-data.js';
const q = new URLSearchParams(location.search), n = (k, d) => (q.has(k) ? +q.get(k) : d);
const cv = document.getElementById('c'), G = createGScene(cv, { half: 48 }), R = G.renderer;
const H = [];
for (const c of CASE) { const mod = await import('./js/' + c.mod + '.js'), api = mod.build(G.M), s = api.size, g = new THREE.Group(); g.position.set(c.x, 0, c.z); g.rotation.y = c.rot * Math.PI / 180; g.add(api.root); G.scene.add(g); g.updateMatrixWorld(true); H.push({ c, api, g, s, center: g.localToWorld(new THREE.Vector3(0, 0, s.cz || 0)) }); }
const env = buildGarden(G, H), X = H[0];
const KEYS = [   // [p, ora, acoperiș, az, el, fw, fh, tx, ty, ox, oy]
  [.03, 6.9, 0, -30, 12, 27, 11, 0, 1.7, .235, 0], [.205, 9.2, 0, -76, 6, 13, 7.5, -3.2, 1.8, .22, 0], [.38, 12.5, 1, -12, 58, 22, 13, 0, 1, .17, 0],
  [.55, 17.6, 0, 30, 8, 23, 9, .5, 1.7, .21, 0], [.715, 21.2, 0, -27, 5.5, 23, 9, -.5, 1.8, .235, 0]];
const W = n('w', 1920), Hh = Math.round(W * 9 / 16 / 2) * 2, asp = W / Hh, cam = G.camera, DEG = Math.PI / 180, tn = Math.tan(15 * DEG), lerp = (a, b, t) => a + (b - a) * t, v = new THREE.Vector3();
R.setPixelRatio(1); R.setSize(W, Hh, false); cv.style.width = W + 'px'; cv.style.height = Hh + 'px'; cam.aspect = asp; cam.fov = 30; cam.near = .5;
let lastT = -9, lastR = -9;
window.__shot = p => {
  let i = 0; while (i < KEYS.length - 2 && p > KEYS[i + 1][0]) i++;
  const a = KEYS[i], b = KEYS[i + 1], f = Math.min(1, Math.max(0, (p - a[0]) / (b[0] - a[0]))), g = .3 * f + .7 * f * f * f * (f * (f * 6 - 15) + 10), c = a.map((x, k) => lerp(x, b[k], g));
  const [, t, roof, az, el, fw, fh, tx, ty, ox, oy] = c, dist = Math.max((fh / 2) / tn, (fw / 2) / (tn * asp));
  if (Math.abs(t - lastT) > .001) { const d = G.setTime(t); env.night(d.n); lastT = t; }
  if (Math.abs(roof - lastR) > .0005) { X.api.openRoof(roof); lastR = roof; }
  v.set(tx, ty, 0); X.g.localToWorld(v); const A = (az + X.c.rot) * DEG, E = el * DEG;
  cam.position.set(v.x + Math.sin(A) * Math.cos(E) * dist, v.y + Math.sin(E) * dist, v.z + Math.cos(A) * Math.cos(E) * dist); cam.lookAt(v);
  cam.setViewOffset(W, Hh, -ox * W, -oy * Hh, W, Hh); cam.updateProjectionMatrix();
  G.scene.fog.near = dist * 1.25; G.scene.fog.far = dist * 1.25 + 430; R.shadowMap.needsUpdate = true; G.render(); return true;
};
window.__shot(n('p', .03)); window.__shot(n('p', .03)); window.__size = [W, Hh]; window.__keys = KEYS.map(k => k[0]); window.__ready = true;
</script>
